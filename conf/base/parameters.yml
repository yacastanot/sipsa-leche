# =============================================================================
# SIPSA LECHE — Parámetros de ejecución mensual
# Equivalente a los %LET de SAS en MARZO_2026.sas
# =============================================================================
# INSTRUCCIONES: Actualizar las 6 variables de período al inicio de cada mes.
# El resto de parámetros son estables y solo cambian por ajuste metodológico.

# ─── PARÁMETROS DE PERÍODO ────────────────────────────────────────────────────
# SAS equivalente:
#   %LET PERI    = 032026;
#   %LET INI_MES = MAR;
#   %LET ANT_MES = FEB;
#   %LET MES     = MARZO 2026;
#   %LET BASE    = BASE032026;

periodo: "032026"               # Código MMAAAA del período actual
mes_actual: "MAR"               # Iniciales del mes actual (sufijo en tablas)
mes_anterior: "FEB"             # Iniciales del mes anterior
mes_largo: "MARZO 2026"         # Nombre completo para rutas de carpetas
mes_largo_anterior: "FEBRERO 2026"
nombre_base: "BASE032026"       # Nombre del archivo Excel de entrada (sin .xlsx)

# ─── RUTAS DEL SERVIDOR DIMPE-D-065 ─────────────────────────────────────────
# SAS: libname MUESTRA '\\DIMPE-D-065\DIMPE\SIPSA\LECHE\2013\PANEL\MUESTRA'
servidor_dimpe: "\\\\DIMPE-D-065\\DIMPE\\SIPSA\\LECHE\\2013"
ruta_panel: "\\\\DIMPE-D-065\\DIMPE\\SIPSA\\LECHE\\2013\\PANEL"

# ─── UMBRALES DE TENDENCIA DEL PRECIO ────────────────────────────────────────
# Fuente: MARZO_2026.sas líneas 129-191
# Finca/Municipio → umbral leve ±5%  (líneas 129-135)
# Depto/Macro     → umbral leve ±3%  (líneas 164-170)

tendencia_umbral_finca_muni:
  bajo_extremo: -0.12     # < -12%     → "xxx"
  bajo_fuerte:  -0.07     # < -7%      → "xx"
  bajo_leve:    -0.05     # < -5%      → "x"
  estable_sup:   0.05     # [-5%,+5%]  → "="
  alto_leve:     0.07     # [+5%,+7%)  → "↑"
  alto_fuerte:   0.12     # [+7%,+12%) → "↑↑"
                          # >= +12%    → "↑↑↑"

tendencia_umbral_dep_macro:
  bajo_extremo: -0.12
  bajo_fuerte:  -0.07
  bajo_leve:    -0.03     # Umbral más estricto que finca/muni
  estable_sup:   0.03
  alto_leve:     0.07
  alto_fuerte:   0.12

# ─── CORRECCIONES DE IDFINCA ─────────────────────────────────────────────────
