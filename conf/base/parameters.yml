# =============================================================================
# SIPSA LECHE — Parámetros de ejecución mensual
# Equivalente a los %LET de SAS en MARZO_2026.sas
# =============================================================================
# INSTRUCCIONES: Actualizar las 6 variables de período al inicio de cada mes.
# El resto de parámetros son estables y solo cambian por ajuste metodológico.

# ─── PARÁMETROS DE PERÍODO ────────────────────────────────────────────────────
# SAS equivalente:
#   %LET PERI    = 032026;
#   %LET INI_MES = MAR;
#   %LET ANT_MES = FEB;
#   %LET MES     = MARZO 2026;
#   %LET BASE    = BASE032026;

periodo: "032026"               # Código MMAAAA del período actual
mes_actual: "MAR"               # Iniciales del mes actual (sufijo en tablas)
mes_anterior: "FEB"             # Iniciales del mes anterior
mes_largo: "MARZO 2026"         # Nombre completo para rutas de carpetas
mes_largo_anterior: "FEBRERO 2026"
nombre_base: "BASE032026"       # Nombre del archivo Excel de entrada (sin .xlsx)
# Nombre del mes en español, minúsculas — se usa como título de la hoja en _ok.xlsx
# Referencia: 01→enero 02→febrero 03→marzo 04→abril 05→mayo 06→junio
#             07→julio 08→agosto 09→septiembre 10→octubre 11→noviembre 12→diciembre
mes_nombre: "Marzo"

# Ajuste del panel trimestral (macro SAS %PANEL: N1,D1,N2,D2).
# Default neutro: T_PROD2 = T_PROD. Actualizar con dias_pendientes/dias_semana
# cuando el operativo requiera ponderar meses incompletos del trimestre.
panel_ajuste:
  N1: 0
  D1: 1
  N2: 0
  D2: 1





# ─── RUTAS CUENTAS NACIONALES (M11) ──────────────────────────────────────────
# Archivos base en data/01_raw/ que el pipeline usa como plantilla de solo lectura.
# Las salidas mensuales se guardan en data/08_reporting/.
ruta_excluidas: "data/01_raw/Excluidas_leche.xlsx"
ruta_leche_cruda_base: "data/01_raw/LECHE_CRUDA_EST_BASE.xlsx"

# ─── UMBRALES DE TENDENCIA DEL PRECIO ────────────────────────────────────────
# Fuente: MARZO_2026.sas líneas 129-191
# Finca/Municipio → umbral leve ±5%  (líneas 129-135)
# Depto/Macro     → umbral leve ±3%  (líneas 164-170)

tendencia_umbral_finca_muni:
  bajo_extremo: -0.12     # < -12%     → "xxx"
  bajo_fuerte:  -0.07     # < -7%      → "xx"
  bajo_leve:    -0.05     # < -5%      → "x"
  estable_sup:   0.05     # [-5%,+5%]  → "="
  alto_leve:     0.07     # [+5%,+7%)  → "↑"
  alto_fuerte:   0.12     # [+7%,+12%) → "↑↑"
                          # >= +12%    → "↑↑↑"

tendencia_umbral_dep_macro:
  bajo_extremo: -0.12
  bajo_fuerte:  -0.07
  bajo_leve:    -0.03     # Umbral más estricto que finca/muni
  estable_sup:   0.03
  alto_leve:     0.07
  alto_fuerte:   0.12

