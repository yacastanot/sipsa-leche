# ─── MACRORREGIONES LECHERAS ──────────────────────────────────────────────────
# Fuente: MACRO LECHE.sas líneas 61-70 (%MACRO VALIDACION)
# Nota: "CAUCA,NARIÑO Y VALLE DEL CAUCA " lleva espacio al final — respetar.

