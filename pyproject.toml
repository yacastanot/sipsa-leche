[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "sipsa_leche"
version = "0.1.0"
readme = "README.md"
description = "Pipeline de migración SIPSA Leche: Encuesta de Leche Cruda en Finca — DANE DIMPE"

dependencies = [
    "kedro~=0.19.15",
    # Datos
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",          # Parquet I/O
    # Excel
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    # Estadística
    "scipy>=1.13",
    # Validación de esquemas
    "pandera>=0.20",
    # Logging estructurado
    "structlog>=24.0",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    # Pruebas
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",            # cliente async para tests FastAPI
    # Calidad de código
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    # pre-commit
    "pre-commit>=3.7",
    # Jupyter
    "ipython>=8.10",
    "jupyterlab>=4.0",
]

[project.scripts]
sipsa-leche = "sipsa_leche.__main__:main"

[tool.kedro]
package_name = "sipsa_leche"
project_name = "sipsa-leche"
kedro_init_version = "0.19.15"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"

[project.entry-points."kedro.hooks"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sipsa_leche"]

# ─── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sipsa_leche --cov-report=term-missing -v"
markers = [
    "regression: tests de regresión numérica contra outputs SAS de referencia",
]
